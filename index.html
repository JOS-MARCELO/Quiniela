<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiniela · Liga BBVA MX · Jornada 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--surface:#fff;--ink:#0F1B2D;--muted:#586578;--line:#D9E0E8;--navy:#10294A;--navy2:#0A1C34;--hit:#1E7A5A;--hit-bg:#E2F1EA;--gold:#B38A1E;--gold-bg:#F7F0DA;--live:#B42318;--warn:#B54708;--chip:#E9EEF4;--r:12px;--sh:0 1px 2px rgba(16,41,74,.06),0 4px 14px rgba(16,41,74,.06);--btn:#10294A;--btn-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A101C;--surface:#121A2A;--ink:#E7ECF3;--muted:#98A4B6;--line:#243047;--navy:#16294A;--navy2:#0E1B33;--hit:#3FB58C;--hit-bg:#12332A;--gold:#D4B04F;--gold-bg:#2C2610;--live:#F0776C;--warn:#E8A15C;--chip:#1A2539;--btn:#6FA3DC;--btn-ink:#08121F;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0A101C;--surface:#121A2A;--ink:#E7ECF3;--muted:#98A4B6;--line:#243047;--navy:#16294A;--navy2:#0E1B33;--hit:#3FB58C;--hit-bg:#12332A;--gold:#D4B04F;--gold-bg:#2C2610;--live:#F0776C;--warn:#E8A15C;--chip:#1A2539;--btn:#6FA3DC;--btn-ink:#08121F;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--btn);color:var(--btn-ink);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.app{width:min(1100px,100%);margin:auto;padding:14px 14px 40px}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:18px;box-shadow:var(--sh)}
.hero-top{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:50px;height:50px;border-radius:12px;border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font:700 22px "IBM Plex Sans Condensed",sans-serif;letter-spacing:.04em}
.ht{flex:1;min-width:0}
.kicker{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.title{font:700 clamp(28px,7vw,38px)/1.05 "IBM Plex Sans Condensed",sans-serif;text-transform:uppercase;margin:3px 0 0;letter-spacing:.01em}
.sub{font-size:13px;opacity:.8;margin-top:2px}
.pill{flex:none;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.pill.live{background:var(--live);border-color:var(--live)}
.pill.curso{background:rgba(255,255,255,.22)}
.pill.fin{background:var(--hit);border-color:var(--hit)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
tr.pin td,tr.pin td.name{background:var(--hit-bg)}
tr.pin td.name{box-shadow:inset 4px 0 var(--hit)}
.tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:middle}
.tag.tl{background:var(--gold);color:#1B1400}
.tag.tp{background:var(--hit);color:#fff}
.vacio{padding:26px;color:var(--muted);font-weight:500;text-align:center}
.pk{position:relative;width:34px;height:34px;margin:auto;border-radius:8px;display:grid;place-items:center;font:700 16px "IBM Plex Sans Condensed",sans-serif;background:var(--chip);color:var(--ink)}
.pk.hit{background:var(--hit);color:#fff}
.pk.hit::after{content:"✓";position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:var(--surface);color:var(--hit);border:1px solid var(--hit);font:700 9px/1 "IBM Plex Sans",sans-serif;display:grid;place-items:center}
.pk.live{outline:2px dashed var(--live);outline-offset:1px}
.pk.canc{opacity:.4;text-decoration:line-through}
.pk.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
td.pts{width:72px}
.pts div{display:inline-block;min-width:42px;padding:2px 9px;border-radius:999px;font:700 19px "IBM Plex Sans Condensed",sans-serif;background:var(--chip);color:var(--muted)}
.pts div.g{background:var(--hit);color:#fff}
.pts div.l{background:var(--gold);color:#1B1400}
.cards{display:none}
.pc{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.pc.lider{border-color:var(--gold);background:var(--gold-bg)}
.pc.pin{border-color:var(--hit);background:var(--hit-bg)}
.pc header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rk{flex:none;min-width:32px;height:32px;padding:0 6px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font:700 16px "IBM Plex Sans Condensed",sans-serif}
.pn{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp{flex:none;font:700 17px "IBM Plex Sans Condensed",sans-serif;padding:2px 11px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pp.g{background:var(--hit);color:#fff}
.pp.l{background:var(--gold);color:#1B1400}
.pg{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pgi{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pgi small{font-size:8.5px;line-height:1.15;text-align:center;color:var(--muted);font-weight:600}
.pgi.cl small{text-decoration:line-through}
.pgi .pk{width:100%;max-width:34px;height:32px;font-size:15px;border-radius:7px}
.more{padding:12px 16px;text-align:center}
.more[hidden]{display:none}
.mas{min-height:44px;padding:0 20px;border-radius:10px;border:1.5px solid var(--btn);background:transparent;color:var(--ink);font-weight:600;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 16px 14px;border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;color:var(--muted)}
.dot{width:14px;height:14px;border-radius:4px;background:var(--chip);flex:none}

["Goofy","LVEELVVLE"],["Panaderia 1","LELLLLLLV"],["Panaderia 2","ELELEVEVE"],["Negro","LEVEVVVVL"],["Papas","LLELLVVLL"],
["Ramon MTZ","LLEELEVVE"],["Yovan","LLEVLLVVV"],["Risser","LVLLEVLLE"],["Nacho Azul","LLEVLVVVE"],["Obrador","LELLEELEE"],

/* ===== Estado ===== */
const $=id=>document.getElementById(id);
const N=PARTIDOS0.length;
const limpia=v=>{v=String(v||"").trim().toUpperCase();return v&&"LEV".includes(v)?v:""};
const padPicks=a=>{a=(a||[]).map(limpia);while(a.length<N)a.push("");return a.slice(0,N)};
let gente=GENTE0.map((x,i)=>({id:"p"+String(i+1).padStart(2,"0"),orden:i+1,nombre:x[0],picks:padPicks(x[1].split(""))}));
let partidos=PARTIDOS0.map((p,i)=>({n:i+1,hk:p[0],ak:p[1],local:EQ[p[0]][0],visitante:EQ[p[1]][0],gl:null,gv:null,estado:"PENDIENTE",fecha:null,reloj:""}));
let ultima=null, filtro="", pinId=null, limite=20;
try{pinId=localStorage.getItem(KEY+"_pin")}catch(e){}

/* ===== Utilidades ===== */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const coincide=(nombre,k)=>{const n=norm(nombre);return EQ[k].slice(2).some(a=>norm(a)===n)}; // coincidencia exacta
const num=v=>v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v));
const fechaTxt=iso=>{const d=new Date(iso);return iso&&!isNaN(d)?new Intl.DateTimeFormat("es-MX",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}).format(d):""};
const hora=iso=>new Date(iso).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const esCerrado=m=>["CANCELADO","POSPUESTO","SUSPENDIDO"].includes(m.estado);

function res(m){ // resultado 1X2 (L/E/V); en vivo solo si CONTAR_EN_VIVO
  if(!m||!num(m.gl)||!num(m.gv))return"";
  if(m.estado!=="FINALIZADO"&&!(CONTAR_EN_VIVO&&m.estado==="EN VIVO"))return"";
  const a=Number(m.gl),b=Number(m.gv);
  return a>b?"L":a<b?"V":"E";

}

/* ===== Eventos y arranque ===== */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  $("vq").hidden=t.dataset.v!=="q"; $("vp").hidden=t.dataset.v!=="p";
}));
$("btnRef").addEventListener("click",actualizar);

$("mas").addEventListener("click",()=>{limite+=20;renderQuiniela()});
$("buscar").addEventListener("input",e=>{filtro=norm(e.target.value);renderQuiniela()});
const fijar=e=>{const el=e.target.closest("[data-id]");if(!el)return;const id=el.dataset.id;pinId=pinId===id?null:id;try{pinId?localStorage.setItem(KEY+"_pin",pinId):localStorage.removeItem(KEY+"_pin")}catch(x){}renderQuiniela()};
$("tbody").addEventListener("click",fijar); $("cards").addEventListener("click",fijar);
cargar(); aplicarManual(); pintar();
if(ultima)$("stamp").textContent="Último dato guardado: "+hora(ultima);
iniciarNube();
actualizar();
setInterval(()=>{ // 30 s con partido en vivo, 60 s sin partido; pausado si la pestaña está oculta
  if(document.hidden)return;
  if(partidos.some(m=>m.estado==="EN VIVO")||!ultima||Date.now()-Date.parse(ultima)>=59000)actualizar();
},30000);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&(!ultima||Date.now()-Date.parse(ultima)>60000))actualizar();
});
